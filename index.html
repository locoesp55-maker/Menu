<style>
:root {
  --noche: #17133a;
  --capa: #211b4d;

  --texto: #f3f0ff;

  --menta: #4ade9a;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--noche); color: var(--texto);
  font: 400 16px/1.5 var(--ui); min-height: 100vh;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sol); outline-offset: 2px; }

.cabeza {
  position: sticky; top: 0; z-index: 5; background: var(--noche);

.titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
.titulo h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.titulo h1 .sol { color: var(--sol); }
.titulo p { margin: 0; font-size: 14px; color: var(--suave); white-space: nowrap; }

.redactor {

  background: var(--capa); border: 1px solid var(--linea); border-radius: 26px;
  padding: 0 8px 0 18px; height: 52px;
}
.redactor:focus-within { border-color: var(--sol); }
.redactor .pre { font: 500 24px/1 var(--cod); color: var(--sol); }
.redactor input {
  flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--texto);
  font: 400 18px/1 var(--cod); height: 100%;
}
.redactor input::placeholder { color: var(--tenue); font-family: var(--ui); }
.redactor .borrar {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--linea);
  font-size: 18px; cursor: pointer; visibility: hidden;
}
.redactor.con-texto .borrar { visibility: visible; }
.leyenda { margin: 8px 4px 12px; font-size: 13px; color: var(--tenue); }
.leyenda code { font-family: var(--cod); font-size: 12px; }
.leyenda .r { color: var(--menta); }
.leyenda .o { color: var(--suave); }

.cats {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; margin: 0 -16px;
  scrollbar-width: none; scroll-snap-type: x proximity;
}
.cats::-webkit-scrollbar { display: none; }
.cat {
  flex: none; scroll-snap-align: start; border: 1px solid var(--linea); background: none;
  border-radius: 18px; padding: 7px 14px; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.cat span { color: var(--tenue); font-size: 13px; margin-left: 4px; }
.cat[aria-pressed="true"] { background: var(--sol); border-color: var(--sol); color: var(--noche); font-weight: 600; }
.cat[aria-pressed="true"] span { color: #5b4500; }
.cabeza.buscando .cats { display: none; }

main { padding: 0 16px 48px; max-width: 640px; margin: 0 auto; }
.seccion { padding: 22px 0 8px; }
.seccion h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.seccion p { margin: 2px 0 0; color: var(--suave); font-size: 15px; }

.lista { list-style: none; margin: 0; padding: 0; }
.item { border-bottom: 1px solid var(--linea); }
.fila {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 14px 0; -webkit-tap-highlight-color: transparent;
}
.sintaxis { font: 500 16px/1.4 var(--cod); color: var(--menta); overflow-wrap: break-word; }
.sintaxis .p { color: var(--sol); }
.sintaxis .r { color: var(--menta); opacity: .75; font-weight: 400; }
.sintaxis .o { color: var(--suave); font-weight: 400; }
.sintaxis .m { color: #9cc4ff; font-weight: 400; }
.corta { display: block; margin-top: 3px; color: var(--suave); font-size: 15px; line-height: 1.4; }
.etq { display: inline-block; margin-left: 6px; font-size: 12px; color: var(--tenue); font-family: var(--ui); font-weight: 400; }

.detalle { padding: 0 0 16px; }
.detalle[hidden] { display: none; }
.detalle dl { margin: 0; display: grid; gap: 10px; }
.detalle dt { font-size: 13px; color: var(--tenue); }
.detalle dd { margin: 2px 0 0; }
.detalle .ej { font: 400 15px/1.4 var(--cod); color: var(--texto); background: var(--capa); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.detalle .nota { color: var(--suave); font-size: 15px; }
.acciones { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.acciones button, .acciones a {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 22px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
}
.copiar { background: var(--sol); color: var(--noche); border: 0; }
.chat { color: var(--texto); border: 1px solid var(--linea); background: none; }

.vacio { padding: 40px 4px; color: var(--suave); }
.vacio strong { display: block; color: var(--texto); font-size: 18px; margin-bottom: 4px; }

.aviso {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
  background: var(--texto); color: var(--noche); font-weight: 600; padding: 10px 18px; border-radius: 22px;
  transition: opacity .2s, transform .2s; pointer-events: none;
}
.aviso.ver { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .aviso { transition: none; } }
</style>

instagram.com/p/XXXX/", "alias": []}, {"n": "pinterest", "cat": "descargas", "corta": "Busca imágenes en Pinterest y te manda varias", "uso": "pinterest <búsqueda> [cantidad 1-6]", "ejemplo": "pinterest gatos aesthetic 5", "alias": []}, {"n": "documento", "cat": "descargas", "corta": "Descarga un archivo desde un enlace directo (hasta 1 GB) y te lo manda como documento. También sirve con enlaces de video", "uso": "documento <enlace>", "ejemplo": "documento https://sitio.com/archivo.zip", "alias": ["archivo"]}, {"n": "playlist", "cat": "descargas", "corta": "Playlist de YouTube en segundo plano (estado / cancelar)", "uso": "playlist <enlace>", "ejemplo": "playlist https://www.youtube.com/playlist?list=PLxxxx", "alias": []}, {"n": "montaje", "cat": "descargas", "corta": "Video con tu palabra resaltada en titulares de periódicos y textos reales", "uso": "montaje <palabra>", "ejemplo": "montaje ganar", "alias": ["palabra"]}, {"n": "buscarvideo", "cat": "descargas", "corta": "Busca videos en YouTube y elige cuál bajar", "uso": "buscarvideo <texto>", "ejemplo": "buscarvideo bad bunny monaco", "alias": ["buscar", "bv"]}, {"n": "buscarmusica", "cat": "descargas", "corta": "Busca canciones en YouTube y elige cuál bajar", "uso": "buscarmusica <texto>", "ejemplo": "buscarmusica bad bunny monaco", "alias": ["bm", "buscarcancion"]}, {"n": "elegir", "cat": "descargas", "corta": "Elige un resultado de tu última búsqueda", "uso": "elegir <número>", "ejemplo": "elegir 2", "alias": []}, {"n": "ss", "cat": "descargas", "corta": "Sticker con sonido (experimental)", "uso": "ss (responde a un video, audio o sticker) [doble]", "ejemplo": "ss (respondiendo a un video)", "alias": ["stickersonido", "sonido"]}, {"n": "ping", "cat": "utilidad", "corta": "Probar si el bot está vivo", "uso": "ping", "alias": []}, {"n": "menu", "cat": "utilidad", "corta": "Menú principal", "uso": "menu [comando]", "alias": ["ayuda"]}, {"n": "limpieza", "cat": "utilidad", "corta": "Borra solo los menús y perfiles en foto viejos (dueño)", "uso": "limpieza [horas|on|off|ahora]", "alias": []}, {"n": "iaconfig", "cat": "utilidad", "corta": "Conecta el cerebro (IA) del bot. Solo el dueño", "uso": "iaconfig <gemini|groq|openrouter|openai|claude> <clave>", "alias": []}, {"n": "menu18", "cat": "utilidad", "corta": "Lista de comandos +18 (si están activados)", "uso": "menu18", "alias": []}, {"n": "topmensajes", "cat": "utilidad", "corta": "Ranking de quienes más escriben en este grupo", "uso": "topmensajes", "alias": ["topmsg", "topmsgs", "topchat"]}, {"n": "topmensajesglobal", "cat": "utilidad", "corta": "Ranking global de mensajes de todos los que usan el bot", "uso": "topmensajesglobal", "alias": ["topmsgglobal", "topglobalmsg", "topglobalmensajes"]}, {"n": "mensajes", "cat": "utilidad", "corta": "Cuántos mensajes llevas (o lleva otra persona)", "uso": "mensajes [@usuario]", "ejemplo": "mensajes @usuario", "alias": ["mismensajes", "msgs"]}, {"n": "menuweb", "cat": "utilidad", "corta": "Menú con buscador que se abre dentro de WhatsApp (experimental)", "uso": "menuweb", "alias": []}]}/*FIN*/;
</script>
<script>
(() => {
  const D = window.MENU, P = D.prefijo || '*'
  const $ = id => document.getElementById(id)
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const sinTilde = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  const cats = Object.entries(D.categorias).filter(([k]) => D.comandos.some(c => c.cat === k))
  let actual = cats[0] ? cats[0][0] : null, abierto = null

  $('prefijo').textContent = P
  $('total').textContent = D.comandos.length + ' comandos'

  // "ss (responde a un video) [doble]" -> sintaxis "ss [doble]" + nota "responde a un video"
  function partir(uso) {
    const notas = []
    const sint = uso.replace(/\s*\(([^)]*)\)/g, (_, n) => (notas.push(n), '')).trim()
    return { sint, nota: notas.join('. ') }
  }
  function pintar(sint) {
    const partes = sint.match(/<[^>]*>|\[[^\]]*\]|\S+/g) || ['']
    let h = '<span class="p">' + esc(P) + '</span>' + esc(partes[0])
    for (const t of partes.slice(1)) {
      const cls = t.startsWith('[') ? 'o' : t.startsWith('@') ? 'm' : 'r'
      h += ' <span class="' + cls + '">' + esc(t).replace(/\|/g, '|<wbr>') + '</span>'
    }
    return h
  }

  function fila(c, conCat) {
    const { sint, nota } = partir(c.uso)
    const id = 'd-' + c.n
    const cat = conCat && D.categorias[c.cat] ? '<span class="etq">' + esc(D.categorias[c.cat].nombre) + '</span>' : ''
    let det = '<dl>'
    if (nota) det += '<div><dt>Cómo se usa</dt><dd class="nota">' + esc(nota.charAt(0).toUpperCase() + nota.slice(1)) + '</dd></div>'
    if (c.ejemplo) det += '<div><dt>Ejemplo</dt><dd class="ej">' + esc(P + c.ejemplo) + '</dd></div>'
    if (c.alias && c.alias.length) det += '<div><dt>También funciona como</dt><dd class="nota">' + c.alias.map(a => esc(P + a)).join(', ') + '</dd></div>'
    if (det === '<dl>') det += '<div><dt>Cómo se usa</dt><dd class="nota">Escríbelo tal cual en el chat.</dd></div>'
    det += '</dl><div class="acciones"><button type="button" class="copiar" data-copiar="' + esc(P + c.n + ' ') + '">Copiar ' + esc(P + c.n) + '</button>'
    if (D.numero) det += '<a class="chat" href="https://wa.me/' + esc(D.numero) + '?text=' + encodeURIComponent(P + c.n + ' ') + '">Escribir al bot</a>'
    det += '</div>'
    return '<li class="item"><button type="button" class="fila" aria-expanded="false" aria-controls="' + esc(id) + '" data-n="' + esc(c.n) + '">' +
      '<span class="sintaxis">' + pintar(sint) + cat + '</span><span class="corta">' + esc(c.corta) + '</span></button>' +
      '<div class="detalle" id="' + esc(id) + '" hidden>' + det + '</div></li>'
  }

  function chips() {
    $('cats').innerHTML = cats.map(([k, v]) => {
      const n = D.comandos.filter(c => c.cat === k).length
      return '<button type="button" class="cat" data-cat="' + esc(k) + '" aria-pressed="' + (k === actual) + '">' + esc(v.nombre) + '<span>' + n + '</span></button>'
    }).join('')
  }

  function mostrar() {
    const q = sinTilde($('buscar').value.trim().replace(new RegExp('^\\' + P), ''))
    $('redactor').classList.toggle('con-texto', !!q)
    $('cabeza').classList.toggle('buscando', !!q)
    let h
    if (q) {
      const palabras = q.split(/\s+/)
      const r = D.comandos.map(c => {
        const nombre = sinTilde(c.n), todo = sinTilde([c.n, ...(c.alias || []), c.corta, c.uso, c.ejemplo || ''].join(' '))
        if (!palabras.every(p => todo.includes(p))) return null
        const puntos = nombre === q ? 0 : nombre.startsWith(q) ? 1 : (c.alias || []).some(a => sinTilde(a).startsWith(q)) ? 2 : 3
        return [puntos, c]
      }).filter(Boolean).sort((a, b) => a[0] - b[0] || a[1].n.localeCompare(b[1].n))
      h = r.length
        ? '<section class="seccion"><h2>' + r.length + (r.length === 1 ? ' resultado' : ' resultados') + '</h2></section><ul class="lista">' + r.map(([, c]) => fila(c, true)).join('') + '</ul>'
        : '<div class="vacio"><strong>Ningún comando coincide con “' + esc($('buscar').value.trim()) + '”</strong>Prueba con otra palabra, por ejemplo lo que quieres hacer: sticker, banco, música.</div>'
    } else if (actual) {
      const v = D.categorias[actual]
      h = '<section class="seccion"><h2>' + esc(v.nombre) + '</h2><p>' + esc(v.desc) + '</p></section><ul class="lista">' +
        D.comandos.filter(c => c.cat === actual).map(c => fila(c, false)).join('') + '</ul>'
    } else h = '<div class="vacio"><strong>Todavía no hay comandos</strong>Vuelve a exportar el menú desde el bot.</div>'
    $('contenido').innerHTML = h
    abierto = null
  }

  function avisar(t) {
    const a = $('aviso'); a.textContent = t; a.classList.add('ver')
    clearTimeout(avisar.t); avisar.t = setTimeout(() => a.classList.remove('ver'), 1600)
  }
  async function copiar(t) {
    try { await navigator.clipboard.writeText(t) } catch {
      const x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0'
      document.body.appendChild(x); x.select(); try { document.execCommand('copy') } catch {} x.remove()
    }
    avisar('Copiado: ' + t.trim() + '. Pégalo en el chat')
  }

  $('cats').addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return
    actual = b.dataset.cat; chips(); mostrar(); window.scrollTo(0, 0)
    const sel = $('cats').querySelector('[aria-pressed="true"]')
    if (sel) sel.scrollIntoView({ inline: 'nearest', block: 'nearest' })
  })
  $('contenido').addEventListener('click', e => {
    const c = e.target.closest('[data-copiar]'); if (c) return copiar(c.dataset.copiar)
    const f = e.target.closest('.fila'); if (!f) return
    const d = document.getElementById(f.getAttribute('aria-controls'))
    if (abierto && abierto !== f) { abierto.setAttribute('aria-expanded', 'false'); document.getElementById(abierto.getAttribute('aria-controls')).hidden = true }
    const ver = f.getAttribute('aria-expanded') !== 'true'
    f.setAttribute('aria-expanded', String(ver)); d.hidden = !ver; abierto = ver ? f : null
  })
  $('buscar').addEventListener('input', mostrar)
  $('borrar').addEventListener('click', () => { $('buscar').value = ''; mostrar(); $('buscar').focus() })

  chips(); mostrar()
})()
</script>
