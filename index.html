<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu del bot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#0f172a,#2e1065);min-height:100vh;color:#fff;padding:16px}
h1{font-size:26px}
.sub{color:#c4b5fd;font-size:13px;letter-spacing:2px;margin-bottom:14px}
.badge{float:right;color:#34d399;border:1px solid #34d399;border-radius:20px;padding:4px 12px;font-size:13px}
#buscar{width:100%;padding:13px 16px;border-radius:14px;border:1px solid #555;background:rgba(0,0,0,.35);color:#fff;font-size:16px;margin-bottom:12px;outline:none}
#cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;padding:9px 16px;border-radius:20px;border:1px solid #666;background:rgba(255,255,255,.06);color:#fff;font-size:14px}
.chip.on{border-color:#34d399;color:#34d399}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px}
.card b{color:#34d399;font-size:17px}
.card p{font-size:13px;color:#ddd6fe;margin-top:4px}
.det{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #555;font-size:13px}
.det i{display:block;color:#fcd34d;margin-top:6px;font-style:normal}
.card.open{grid-column:1/-1;border-color:#a78bfa}
.card.open .det{display:block}
</style>
</head>
<body>
<span class="badge" id="total"></span>
<h1>Menu</h1>
<div class="sub">MENU INTERACTIVO</div>
<input id="buscar" type="search" placeholder="Buscar comando...">
<div id="cats"></div>
<div class="grid" id="lista"></div>
<script>
var PREFIJO = '*';
var COMANDOS = [
  {n:'perfil',cat:'Perfil',corta:'Tu tarjeta de perfil',detalle:'Muestra una imagen con tu foto, nivel, XP y monedas.',uso:'perfil'},
  {n:'daily',cat:'Economia',corta:'Recompensa diaria',detalle:'Te da 500 monedas y 20 XP. Una vez cada 24 horas.',uso:'daily'},
  {n:'trabajar',cat:'Economia',corta:'Gana monedas',detalle:'Ganas entre 50 y 150 monedas y 10 XP. Cada 1 hora.',uso:'trabajar'},
  {n:'ping',cat:'Utilidad',corta:'Probar el bot',detalle:'Responde pong si el bot esta activo.',uso:'ping'},
  {n:'menu',cat:'Utilidad',corta:'Abrir este menu',detalle:'Te envia el enlace a este menu.',uso:'menu'}
];
var catActual = 'Todos';
function el(id){ return document.getElementById(id); }
el('total').textContent = COMANDOS.length + ' cmds';

function pintarCats(){
  var cats = ['Todos'];
  COMANDOS.forEach(function(c){ if(cats.indexOf(c.cat) < 0) cats.push(c.cat); });
  el('cats').innerHTML = '';
  cats.forEach(function(c){
    var b = document.createElement('button');
    b.className = 'chip' + (c === catActual ? ' on' : '');
    b.textContent = c;
    b.onclick = function(){ catActual = c; pintarCats(); pintarLista(); };
    el('cats').appendChild(b);
  });
}

function pintarLista(){
  var q = el('buscar').value.toLowerCase().trim();
  el('lista').innerHTML = '';
  COMANDOS.forEach(function(c){
    if(catActual !== 'Todos' && c.cat !== catActual) return;
    if(c.n.indexOf(q) < 0 && c.corta.toLowerCase().indexOf(q) < 0) return;
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<b></b><p></p><div class="det"><span></span><i></i></div>';
    d.querySelector('b').textContent = PREFIJO + c.n;
    d.querySelector('p').textContent = c.corta;
    d.querySelector('span').textContent = c.detalle;
    d.querySelector('i').textContent = 'Uso: ' + PREFIJO + c.uso;
    d.onclick = function(){ d.classList.toggle('open'); };
    el('lista').appendChild(d);
  });
}

el('buscar').oninput = pintarLista;
pintarCats();
pintarLista();
</script>
</body>
</html>
